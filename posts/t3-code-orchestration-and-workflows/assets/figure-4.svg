<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" role="img" aria-label="T3 Code 固定 Workflow（Effect v4）确定性重放与状态机架构">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif; }
      .title { font-size: 19px; font-weight: 700; fill: #172d32; }
      .subtitle { font-size: 13px; fill: #4f6668; }
      .hdr { font-size: 13.5px; font-weight: 700; fill: #ffffff; }
      .hdr-sub { font-size: 11.5px; fill: #e3f0f2; }
      .pill-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .box-title { font-size: 13.5px; font-weight: 700; fill: #172d32; }
      .box-sub { font-size: 12px; fill: #4f6668; }
      .label { font-size: 12.5px; font-weight: 700; fill: #172d32; }
      .small { font-size: 11.5px; fill: #4f6668; }
      .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #172d32; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#4c686b"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#0b6e67"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#a87624"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#a64538"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#3b6296"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#5d4b8c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="770" fill="#ffffff"/>

  <text x="36" y="40" class="title">T3 Code 固定 Workflow 底层原理：Effect v4 确定性重放与持久化引擎</text>
  <text x="36" y="62" class="subtitle">将多阶段自动化写成普通 TypeScript 生成器；每一步结果写入 SQLite Journal，重启与唤醒从头重放并秒跳过已完成步骤</text>
  <rect x="36" y="88" width="250" height="252" rx="10" fill="#edf3fa" stroke="#4b74ab" stroke-width="1.6"/>
  <path d="M 46 88 H 276 Q 286 88 286 98 V 120 H 36 V 98 Q 36 88 46 88 Z" fill="#3b6296"/>
  <text x="161.0" y="109" text-anchor="middle" class="hdr">外部触发器（Triggers）</text>
  <text x="161.0" y="152.2" text-anchor="middle" class="box-sub">• every('1h') / daily('09:00')</text>
  <text x="161.0" y="172.8" text-anchor="middle" class="box-sub">  本地时区，停机折叠防风暴</text>
  <text x="161.0" y="193.2" text-anchor="middle" class="box-sub">• webhook('name', { key })</text>
  <text x="161.0" y="213.8" text-anchor="middle" class="box-sub">  自带私密路径 · 60/min 限流</text>
  <text x="161.0" y="234.2" text-anchor="middle" class="box-sub">  识别 GitHub/Linear 重试头去重</text>
  <text x="161.0" y="254.8" text-anchor="middle" class="box-sub">• issues.opened / pullRequests</text>
  <text x="161.0" y="275.2" text-anchor="middle" class="box-sub">  每分钟轮询，仅抓加载后新增</text>
  <text x="161.0" y="295.8" text-anchor="middle" class="box-sub">• CLI t3 workflow start --key</text>
  <text x="161.0" y="316.2" text-anchor="middle" class="box-sub">  跨版本按 key 严格幂等去重</text>
  <rect x="36" y="360" width="250" height="192" rx="10" fill="#f2effa" stroke="#7763ad" stroke-width="1.6"/>
  <path d="M 46 360 H 276 Q 286 360 286 370 V 392 H 36 V 370 Q 36 360 46 360 Z" fill="#5d4b8c"/>
  <text x="161.0" y="381" text-anchor="middle" class="hdr">热重载加载器（WorkflowRuntime）</text>
  <text x="161.0" y="423.5" text-anchor="middle" class="box-sub">监听 ~/.t3/workflows/*.ts</text>
  <text x="161.0" y="444.5" text-anchor="middle" class="box-sub">Node 原生类型剥离，无需编译</text>
  <text x="161.0" y="465.5" text-anchor="middle" class="box-sub">全局注入 T3 / Effect / Schema</text>
  <text x="161.0" y="486.5" text-anchor="middle" class="box-sub">（严禁 import 'effect' 防双实例）</text>
  <text x="161.0" y="507.5" text-anchor="middle" class="box-sub">语法报错或删除未终结旧版 → 拒绝</text>
  <text x="161.0" y="528.5" text-anchor="middle" class="box-sub">自动保留上一可用版本继续运行</text>
  <rect x="318" y="88" width="546" height="464" rx="14" fill="#e9f5f2" stroke="#0b6e67" stroke-width="2"/>
  <rect x="336" y="102" width="376" height="26" rx="13.0" fill="#0b6e67"/>
  <text x="524.0" y="119.3" text-anchor="middle" class="pill-text">Effect v4 Durable Replay 引擎（ClusterWorkflowEngine）</text>
  <text x="336" y="148" class="small" style="fill:#0c4742">每次从休眠 / 等待 / 进程重启唤醒 → 从第 1 行重跑 body → 命中 Journal 直接返回缓存值</text>
  <rect x="336" y="162" width="114" height="72" rx="10" fill="#e9f5f2" stroke="#168077" stroke-width="1.6"/>
  <text x="393.0" y="183.2" text-anchor="middle" class="box-title" style="fill:#0c4742">step('fetch')</text>
  <text x="393.0" y="202.8" text-anchor="middle" class="box-sub">✓ 命中 Journal</text>
  <text x="393.0" y="222.2" text-anchor="middle" class="box-sub">直接返回缓存</text>
  <rect x="470" y="162" width="130" height="72" rx="10" fill="#e9f5f2" stroke="#168077" stroke-width="1.6"/>
  <text x="535.0" y="183.2" text-anchor="middle" class="box-title" style="fill:#0c4742">agent('fix')</text>
  <text x="535.0" y="202.8" text-anchor="middle" class="box-sub">✓ 命中 Journal</text>
  <text x="535.0" y="222.2" text-anchor="middle" class="box-sub">返回 {value,thread}</text>
  <rect x="620" y="162" width="118" height="72" rx="10" fill="#fdf5e4" stroke="#c28e34" stroke-width="1.6"/>
  <text x="679.0" y="183.2" text-anchor="middle" class="box-title" style="fill:#5e410d">ask('ship')</text>
  <text x="679.0" y="202.8" text-anchor="middle" class="box-sub">⏸ 挂起等待</text>
  <text x="679.0" y="222.2" text-anchor="middle" class="box-sub">DurableDeferred</text>
  <rect x="758" y="162" width="88" height="72" rx="10" fill="#eef3f5" stroke="#4b6d80" stroke-width="1.6"/>
  <text x="802.0" y="183.2" text-anchor="middle" class="box-title" style="fill:#1b3340">step('go')</text>
  <text x="802.0" y="202.8" text-anchor="middle" class="box-sub">未执行</text>
  <text x="802.0" y="222.2" text-anchor="middle" class="box-sub">醒后推进</text>
  <line x1="450" y1="198" x2="470" y2="198" stroke="#0b6e67" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <line x1="600" y1="198" x2="620" y2="198" stroke="#0b6e67" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <line x1="738" y1="198" x2="758" y2="198" stroke="#a87624" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-amber)"/>
  <rect x="336" y="254" width="248" height="84" rx="10" fill="#eef3f5" stroke="#4b6d80" stroke-width="1.6"/>
  <text x="460.0" y="281.2" text-anchor="middle" class="box-title" style="fill:#1b3340">step / step.try</text>
  <text x="460.0" y="300.8" text-anchor="middle" class="box-sub">默认 0 次重试防重复副作用</text>
  <text x="460.0" y="320.2" text-anchor="middle" class="box-sub">未捕获失败触发 SuspendOnFailure</text>
  <rect x="598" y="254" width="248" height="84" rx="10" fill="#edf3fa" stroke="#4b74ab" stroke-width="1.6"/>
  <text x="722.0" y="281.2" text-anchor="middle" class="box-title" style="fill:#1c385c">agent / agent.try</text>
  <text x="722.0" y="300.8" text-anchor="middle" class="box-sub">启动普通 Thread · 支持跨机与 Worktree</text>
  <text x="722.0" y="320.2" text-anchor="middle" class="box-sub">带 returns 自动纠偏 ≤2 次 + quiet</text>
  <rect x="336" y="352" width="248" height="84" rx="10" fill="#fdf5e4" stroke="#c28e34" stroke-width="1.6"/>
  <text x="460.0" y="379.2" text-anchor="middle" class="box-title" style="fill:#5e410d">ask / wait / pullRequests.wait</text>
  <text x="460.0" y="398.8" text-anchor="middle" class="box-sub">人工审批盖章 answeredBy / At</text>
  <text x="460.0" y="418.2" text-anchor="middle" class="box-sub">早到信号经 workflow_mail 缓冲 7 天</text>
  <rect x="598" y="352" width="248" height="84" rx="10" fill="#e9f5f2" stroke="#168077" stroke-width="1.6"/>
  <text x="722.0" y="379.2" text-anchor="middle" class="box-title" style="fill:#0c4742">sleep / within / invoke</text>
  <text x="722.0" y="398.8" text-anchor="middle" class="box-sub">DurableClock 零内存阈值全落盘</text>
  <text x="722.0" y="418.2" text-anchor="middle" class="box-sub">持久化并发池(FIFO锁) · 嵌套子流程</text>
  <rect x="336" y="450" width="248" height="84" rx="10" fill="#f2effa" stroke="#7763ad" stroke-width="1.6"/>
  <text x="460.0" y="477.2" text-anchor="middle" class="box-title" style="fill:#352859">store &amp; signal（仅 step/onEnd）</text>
  <text x="460.0" y="496.8" text-anchor="middle" class="box-sub">跨 Run 事务性 KV（store.transaction）</text>
  <text x="460.0" y="516.2" text-anchor="middle" class="box-sub">signal 缓冲 / signalAll 广播唤醒</text>
  <rect x="598" y="450" width="248" height="84" rx="10" fill="#fcefed" stroke="#c45b4d" stroke-width="1.6"/>
  <text x="722.0" y="477.2" text-anchor="middle" class="box-title" style="fill:#63221a">onEnd 最终清理钩子</text>
  <text x="722.0" y="496.8" text-anchor="middle" class="box-sub">完成/停止/跳过/取消均触发</text>
  <text x="722.0" y="516.2" text-anchor="middle" class="box-sub">取消先等 inFlight 落停再退避重试 5 次</text>
  <line x1="286" y1="206" x2="318" y2="206" stroke="#3b6296" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="286" y1="456" x2="318" y2="456" stroke="#5d4b8c" stroke-width="1.8" marker-end="url(#arr-violet)"/>
  <rect x="892" y="88" width="272" height="464" rx="14" fill="#f6f9f8" stroke="#4b6d80" stroke-width="1.6"/>
  <text x="910" y="114" class="box-title" style="fill:#1b3340">Run 7 态生命周期与 15s Sweep</text>
  <rect x="938" y="134" width="174" height="44" rx="10" fill="#e9f5f2" stroke="#168077" stroke-width="1.6"/>
  <text x="1025.0" y="160.8" text-anchor="middle" class="box-title" style="fill:#0c4742">running（推进中）</text>
  <rect x="938" y="206" width="174" height="58" rx="10" fill="#fdf5e4" stroke="#c28e34" stroke-width="1.6"/>
  <text x="1025.0" y="230.0" text-anchor="middle" class="box-title" style="fill:#5e410d">waiting（休眠/排队）</text>
  <text x="1025.0" y="249.5" text-anchor="middle" class="box-sub">agent · ask · wait · sleep</text>
  <rect x="938" y="290" width="174" height="68" rx="10" fill="#fcefed" stroke="#c45b4d" stroke-width="1.6"/>
  <text x="1025.0" y="309.2" text-anchor="middle" class="box-title" style="fill:#63221a">paused（失败挂起）</text>
  <text x="1025.0" y="328.8" text-anchor="middle" class="box-sub">代码错 5m/20m/80m 自恢</text>
  <text x="1025.0" y="348.2" text-anchor="middle" class="box-sub">Agent 放弃置 held=1</text>
  <rect x="910" y="388" width="236" height="68" rx="10" fill="#eef3f5" stroke="#4b6d80" stroke-width="1.6"/>
  <text x="1028.0" y="407.2" text-anchor="middle" class="box-title" style="fill:#1b3340">四种终态（触发 onEnd）</text>
  <text x="1028.0" y="426.8" text-anchor="middle" class="box-sub">completed · stopped（主动）</text>
  <text x="1028.0" y="446.2" text-anchor="middle" class="box-sub">skipped（过滤）· cancelled（级联）</text>
  <rect x="910" y="474" width="236" height="60" rx="10" fill="#edf3fa" stroke="#4b74ab" stroke-width="1.6"/>
  <text x="1028.0" y="499.0" text-anchor="middle" class="box-title" style="fill:#1c385c">后台 Sweep（每 15s 巡检）</text>
  <text x="1028.0" y="518.5" text-anchor="middle" class="box-sub">超时检查 · 自动 Resume · 重挂监控</text>
  <line x1="998" y1="178" x2="998" y2="206" stroke="#a87624" stroke-width="1.8" marker-end="url(#arr-amber)"/>
  <line x1="1054" y1="206" x2="1054" y2="178" stroke="#0b6e67" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <path d="M 938 156 H 912 V 324 H 938" fill="none" stroke="#a64538" stroke-width="1.8" marker-end="url(#arr-rose)"/>
  <path d="M 1112 324 H 1146 V 156 H 1112" fill="none" stroke="#0b6e67" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-teal)"/>
  <rect x="1123" y="226" width="38" height="22" rx="4" fill="#f6f9f8"/>
  <text x="1142" y="241" text-anchor="middle" class="small" style="fill:#0b6e67;font-weight:700">恢复</text>
  <line x1="1025" y1="358" x2="1025" y2="388" stroke="#4c686b" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="864" y1="236" x2="892" y2="236" stroke="#a87624" stroke-width="1.8" marker-end="url(#arr-amber)"/>
  <rect x="36" y="580" width="1128" height="162" rx="12" fill="#ffffff" stroke="#4b6d80" stroke-width="1.6"/>
  <rect x="54" y="594" width="382" height="25" rx="12.5" fill="#365668"/>
  <text x="245.0" y="610.8" text-anchor="middle" class="pill-text">SQLite 持久化层（11 张业务表 + Effect 引擎 Journal）</text>
  <rect x="54" y="632" width="210" height="94" rx="10" fill="#e9f5f2" stroke="#168077" stroke-width="1.6"/>
  <text x="159.0" y="654.5" text-anchor="middle" class="box-title" style="fill:#0c4742">执行与重放核心</text>
  <text x="159.0" y="674.0" text-anchor="middle" class="box-sub">workflow_runs（唯一键/版本）</text>
  <text x="159.0" y="693.5" text-anchor="middle" class="box-sub">workflow_steps（步骤/线程ID）</text>
  <text x="159.0" y="713.0" text-anchor="middle" class="box-sub">Effect Cluster Journal 表</text>
  <rect x="278" y="632" width="212" height="94" rx="10" fill="#fdf5e4" stroke="#c28e34" stroke-width="1.6"/>
  <text x="384.0" y="654.5" text-anchor="middle" class="box-title" style="fill:#5e410d">等待与早到邮箱</text>
  <text x="384.0" y="674.0" text-anchor="middle" class="box-sub">workflow_waits（Token/Watch）</text>
  <text x="384.0" y="693.5" text-anchor="middle" class="box-sub">workflow_mail（早到缓冲7天）</text>
  <text x="384.0" y="713.0" text-anchor="middle" class="box-sub">workflow_signals（信号去重）</text>
  <rect x="504" y="632" width="206" height="94" rx="10" fill="#edf3fa" stroke="#4b74ab" stroke-width="1.6"/>
  <text x="607.0" y="654.5" text-anchor="middle" class="box-title" style="fill:#1c385c">并发池与标记</text>
  <text x="607.0" y="674.0" text-anchor="middle" class="box-sub">workflow_pool_places</text>
  <text x="607.0" y="693.5" text-anchor="middle" class="box-sub">四态：queued/held/away/returning</text>
  <text x="607.0" y="713.0" text-anchor="middle" class="box-sub">workflow_marks（防二次通过）</text>
  <rect x="724" y="632" width="208" height="94" rx="10" fill="#f2effa" stroke="#7763ad" stroke-width="1.6"/>
  <text x="828.0" y="654.5" text-anchor="middle" class="box-title" style="fill:#352859">触发器与密钥</text>
  <text x="828.0" y="674.0" text-anchor="middle" class="box-sub">workflow_triggers（下次时间）</text>
  <text x="828.0" y="693.5" text-anchor="middle" class="box-sub">workflow_hooks（私密 Token）</text>
  <text x="828.0" y="713.0" text-anchor="middle" class="box-sub">workflow_store（跨 Run KV）</text>
  <rect x="946" y="632" width="200" height="94" rx="10" fill="#eef3f5" stroke="#4b6d80" stroke-width="1.6"/>
  <text x="1046.0" y="654.5" text-anchor="middle" class="box-title" style="fill:#1b3340">实体关联与剪枝</text>
  <text x="1046.0" y="674.0" text-anchor="middle" class="box-sub">workflow_run_references</text>
  <text x="1046.0" y="693.5" text-anchor="middle" class="box-sub">（反查 Issue / PR / Thread）</text>
  <text x="1046.0" y="713.0" text-anchor="middle" class="box-sub">终态 1h 后仅剪枝引擎 Journal</text>
  <line x1="590" y1="552" x2="590" y2="580" stroke="#0b6e67" stroke-width="1.8" marker-end="url(#arr-teal)"/>
</svg>