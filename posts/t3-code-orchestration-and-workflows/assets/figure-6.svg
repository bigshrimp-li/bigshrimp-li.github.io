<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-label="三层协同全景：t3.json 底座 × T3 控制面 × 两种 Workflow 范式">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif; }
      .title { font-size: 19px; font-weight: 700; fill: #172d32; }
      .subtitle { font-size: 13px; fill: #4f6668; }
      .hdr { font-size: 13.5px; font-weight: 700; fill: #ffffff; }
      .hdr-sub { font-size: 11.5px; fill: #e3f0f2; }
      .pill-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .box-title { font-size: 13.5px; font-weight: 700; fill: #172d32; }
      .box-sub { font-size: 12px; fill: #4f6668; }
      .label { font-size: 12.5px; font-weight: 700; fill: #172d32; }
      .small { font-size: 11.5px; fill: #4f6668; }
      .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #172d32; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#4c686b"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#0b6e67"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#a87624"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#a64538"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#3b6296"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#5d4b8c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="580" fill="#ffffff"/>

  <text x="36" y="40" class="title">三层协同全景：工作区契约 × 控制平面 × 两种 Workflow 范式的互补定位</text>
  <text x="36" y="62" class="subtitle">固定代码级 Workflow 与技能驱动型研发 Workflow 并非替代关系，而是分别解决“无人值守确定性流水线”与“人机协同复杂研发”</text>
  <rect x="36" y="90" width="548" height="206" rx="10" fill="#e9f5f2" stroke="#168077" stroke-width="1.6"/>
  <path d="M 46 90 H 574 Q 584 90 584 100 V 122 H 36 V 100 Q 36 90 46 90 Z" fill="#0b6e67"/>
  <text x="310.0" y="111" text-anchor="middle" class="hdr">范式 A · T3 内置固定 Workflow（代码级确定性编排）</text>
  <text x="310.0" y="168.5" text-anchor="middle" class="box-sub">载体：~/.t3/workflows/*.ts（Effect v4 引擎驱动）</text>
  <text x="310.0" y="190.5" text-anchor="middle" class="box-sub">控制权：TypeScript 确定性代码主导流程，AI 只做局部 agent() 节点</text>
  <text x="310.0" y="212.5" text-anchor="middle" class="box-sub">强项：跨天休眠、重启重放不丢进度、Webhook/定时/Issue 自动触发、并发池锁</text>
  <text x="310.0" y="234.5" text-anchor="middle" class="box-sub">典型场景：Issue 自动复现分诊 · 每日依赖升级 · PR CI 守望自动合并 · 云主机清理</text>
  <text x="310.0" y="256.5" text-anchor="middle" class="box-sub">代价：改流程需改代码并升 version，且依赖 T3 Server 常驻在线</text>
  <rect x="616" y="90" width="548" height="206" rx="10" fill="#f2effa" stroke="#7763ad" stroke-width="1.6"/>
  <path d="M 626 90 H 1154 Q 1164 90 1164 100 V 122 H 616 V 100 Q 616 90 626 90 Z" fill="#5d4b8c"/>
  <text x="890.0" y="111" text-anchor="middle" class="hdr">范式 B · agent-loop-core 研发 Workflow（技能/路由级编排）</text>
  <text x="890.0" y="168.5" text-anchor="middle" class="box-sub">载体：pstack-playbook/*.md + .agents/resources/t3-routing.json</text>
  <text x="890.0" y="190.5" text-anchor="middle" class="box-sub">控制权：主会话 Coordinator 按剧本灵活推进，用 delegate_task 调度 13 角色</text>
  <text x="890.0" y="212.5" text-anchor="middle" class="box-sub">强项：迭代沟通收敛需求、异构多模型扬长避短、跨家族双路评审、零部署即改即用</text>
  <text x="890.0" y="234.5" text-anchor="middle" class="box-sub">典型场景：复杂跨模块需求研发 · 交互原型对齐 · 行为验收与架构级合并导读</text>
  <text x="890.0" y="256.5" text-anchor="middle" class="box-sub">代价：依赖主模型遵守护栏纪律，不具备框架级自动持久化重放</text>
  <rect x="36" y="336" width="1128" height="96" rx="10" fill="#eef3f5" stroke="#4b6d80" stroke-width="1.6"/>
  <path d="M 46 336 H 1154 Q 1164 336 1164 346 V 368 H 36 V 346 Q 36 336 46 336 Z" fill="#365668"/>
  <text x="600.0" y="357" text-anchor="middle" class="hdr">中间控制平面：T3 Code Orchestration V2 + Authenticated MCP + Multi-Provider Adapters</text>
  <text x="600.0" y="392.5" text-anchor="middle" class="box-sub">统一底座原语：delegate_task · orchestrator_capabilities · t3_thread_* · preview_* · watch_pull_request · schedule_task · PeerForwarding</text>
  <text x="600.0" y="414.5" text-anchor="middle" class="box-sub">核心保障：单事务 EventSink（事件+投影+回执+Outbox） · 权限天花板 · Reactive Wakeup 零轮询 · 隐藏 Ref Checkpoint 回滚</text>
  <rect x="36" y="462" width="1128" height="94" rx="10" fill="#edf3fa" stroke="#4b74ab" stroke-width="1.6"/>
  <path d="M 46 462 H 1154 Q 1164 462 1164 472 V 494 H 36 V 472 Q 36 462 46 462 Z" fill="#3b6296"/>
  <text x="600.0" y="483" text-anchor="middle" class="hdr">底层工作区契约：仓库根 t3.json + Git Worktree / 多仓库 / 安全审批</text>
  <text x="600.0" y="517.5" text-anchor="middle" class="box-sub">为上面两类 Workflow 统一提供可复现的隔离工作树：defaultThreadEnvMode · worktreeSparsePatternsPath · worktreeLayout（哈希审批）</text>
  <text x="600.0" y="539.5" text-anchor="middle" class="box-sub">全生命周期环境托管：runOnWorktreeCreate（装依赖/拷环境）→ previewUrl（实机预览）→ stopOnSettle / runOnSettle（关服务/清产物）</text>
  <line x1="310" y1="296" x2="310" y2="336" stroke="#0b6e67" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <rect x="233.1" y="308.5" width="153.8" height="17" rx="4" fill="#ffffff" opacity="0.94"/>
  <text x="310.0" y="321.0" text-anchor="middle" class="small" style="fill:#0b6e67;font-weight:600">原生调用 Thread/Agent</text>
  <line x1="890" y1="296" x2="890" y2="336" stroke="#5d4b8c" stroke-width="1.8" marker-end="url(#arr-violet)"/>
  <rect x="816.7" y="308.5" width="146.6" height="17" rx="4" fill="#ffffff" opacity="0.94"/>
  <text x="890.0" y="321.0" text-anchor="middle" class="small" style="fill:#5d4b8c;font-weight:600">通过 MCP 调用编排原语</text>
  <line x1="600" y1="432" x2="600" y2="462" stroke="#365668" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="514.4" y="439.5" width="171.2" height="17" rx="4" fill="#ffffff" opacity="0.94"/>
  <text x="600.0" y="452.0" text-anchor="middle" class="small" style="fill:#365668;font-weight:600">Worktree 创建 / 结案钩子</text>
</svg>