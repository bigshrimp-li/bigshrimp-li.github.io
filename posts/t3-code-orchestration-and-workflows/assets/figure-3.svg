<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="t3.json 四层配置继承、生命周期钩子与安全审批机制">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif; }
      .title { font-size: 19px; font-weight: 700; fill: #172d32; }
      .subtitle { font-size: 13px; fill: #4f6668; }
      .hdr { font-size: 13.5px; font-weight: 700; fill: #ffffff; }
      .hdr-sub { font-size: 11.5px; fill: #e3f0f2; }
      .pill-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .box-title { font-size: 13.5px; font-weight: 700; fill: #172d32; }
      .box-sub { font-size: 12px; fill: #4f6668; }
      .label { font-size: 12.5px; font-weight: 700; fill: #172d32; }
      .small { font-size: 11.5px; fill: #4f6668; }
      .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #172d32; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#4c686b"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#0b6e67"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#a87624"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#a64538"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#3b6296"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#5d4b8c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="650" fill="#ffffff"/>

  <text x="36" y="40" class="title">t3.json 配置继承优先级、Worktree 生命周期钩子与安全防线</text>
  <text x="36" y="62" class="subtitle">将团队共享的项目动作、稀疏检出与多仓布局纳入 Git 版本控制，同时用精确命令哈希审批拦截恶意仓库 RCE</text>
  <rect x="36" y="86" width="342" height="530" rx="12" fill="#f6f9f8" stroke="#4b6d80" stroke-width="1.5"/>
  <text x="54" y="112" class="box-title" style="fill:#1b3340">四层配置解析优先级（高 → 低）</text>
  <text x="54" y="131" class="small">源码：projectSettings.ts · 首个非继承值胜出</text>
  <rect x="54" y="152" width="306" height="70" rx="10" fill="#edf3fa" stroke="#4b74ab" stroke-width="1.6"/>
  <text x="207.0" y="172.2" text-anchor="middle" class="box-title" style="fill:#1c385c">1. Project Override（项目级覆盖）</text>
  <text x="207.0" y="191.8" text-anchor="middle" class="box-sub">Settings → Projects 单独覆盖</text>
  <text x="207.0" y="211.2" text-anchor="middle" class="box-sub">仅存当前 Server，最高优先级</text>
  <line x1="207" y1="222" x2="207" y2="248" stroke="#4c686b" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="220.0" y="226.5" width="96.0" height="17" rx="4" fill="#ffffff" opacity="0.94"/>
  <text x="268.0" y="239.0" text-anchor="middle" class="small" style="fill:#4c686b;font-weight:600">未配置 / 继承</text>
  <rect x="54" y="248" width="306" height="70" rx="10" fill="#eef3f5" stroke="#4b6d80" stroke-width="1.6"/>
  <text x="207.0" y="268.2" text-anchor="middle" class="box-title" style="fill:#1b3340">2. Environment Setting（环境级）</text>
  <text x="207.0" y="287.8" text-anchor="middle" class="box-sub">Settings 全局默认，可设为 null</text>
  <text x="207.0" y="307.2" text-anchor="middle" class="box-sub">留空即向下继承仓库 t3.json</text>
  <line x1="207" y1="318" x2="207" y2="344" stroke="#4c686b" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="220.0" y="322.5" width="96.0" height="17" rx="4" fill="#ffffff" opacity="0.94"/>
  <text x="268.0" y="335.0" text-anchor="middle" class="small" style="fill:#4c686b;font-weight:600">未配置 / 继承</text>
  <rect x="54" y="344" width="306" height="70" rx="10" fill="#e9f5f2" stroke="#168077" stroke-width="1.6"/>
  <text x="207.0" y="364.2" text-anchor="middle" class="box-title" style="fill:#0c4742">3. 仓库根目录 t3.json</text>
  <text x="207.0" y="383.8" text-anchor="middle" class="box-sub">随 Git 共享：默认环境/子模块/脚本</text>
  <text x="207.0" y="403.2" text-anchor="middle" class="box-sub">多仓项目仅读根级，忽略子仓配置</text>
  <line x1="207" y1="414" x2="207" y2="440" stroke="#4c686b" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="220.0" y="418.5" width="96.0" height="17" rx="4" fill="#ffffff" opacity="0.94"/>
  <text x="268.0" y="431.0" text-anchor="middle" class="small" style="fill:#4c686b;font-weight:600">未配置 / 继承</text>
  <rect x="54" y="440" width="306" height="70" rx="10" fill="#fdf5e4" stroke="#c28e34" stroke-width="1.6"/>
  <text x="207.0" y="460.2" text-anchor="middle" class="box-title" style="fill:#5e410d">4. Built-in Default（内置默认）</text>
  <text x="207.0" y="479.8" text-anchor="middle" class="box-sub">defaultThreadEnvMode: 'local'</text>
  <text x="207.0" y="499.2" text-anchor="middle" class="box-sub">worktreeSubmodules: 'recursive'</text>
  <rect x="54" y="530" width="306" height="68" rx="10" fill="#fcefed" stroke="#c45b4d" stroke-width="1.6"/>
  <text x="207.0" y="549.2" text-anchor="middle" class="box-title" style="fill:#63221a">解析失败保护（Lenient JSON + Schema）</text>
  <text x="207.0" y="568.8" text-anchor="middle" class="box-sub">语法或图标值非法时整份忽略并告警</text>
  <text x="207.0" y="588.2" text-anchor="middle" class="box-sub">绝不半截生效造成幽灵行为</text>
  <rect x="404" y="86" width="760" height="296" rx="12" fill="#f6f9f8" stroke="#168077" stroke-width="1.5"/>
  <text x="424" y="112" class="box-title" style="fill:#0c4742">线程 Worktree 生命周期中的 t3.json 自动化接管点</text>
  <rect x="424" y="130" width="224" height="232" rx="10" fill="#e9f5f2" stroke="#168077" stroke-width="1.6"/>
  <path d="M 434 130 H 638 Q 648 130 648 140 V 162 H 424 V 140 Q 424 130 434 130 Z" fill="#0b6e67"/>
  <text x="536.0" y="151" text-anchor="middle" class="hdr">阶段 A · 创建 Worktree</text>
  <text x="536.0" y="194.5" text-anchor="middle" class="box-sub">1. worktreeLayout.create</text>
  <text x="536.0" y="215.0" text-anchor="middle" class="box-sub">   自定义多仓布局（10m 超时）</text>
  <text x="536.0" y="235.5" text-anchor="middle" class="box-sub">2. worktreeSparsePatternsPath</text>
  <text x="536.0" y="256.0" text-anchor="middle" class="box-sub">   非 cone 稀疏检出（缺失即失败）</text>
  <text x="536.0" y="276.5" text-anchor="middle" class="box-sub">3. worktreeSubmodules</text>
  <text x="536.0" y="297.0" text-anchor="middle" class="box-sub">   recursive / top-level / none</text>
  <text x="536.0" y="317.5" text-anchor="middle" class="box-sub">4. runOnWorktreeCreate</text>
  <text x="536.0" y="338.0" text-anchor="middle" class="box-sub">   async: true 并行 / false 阻塞</text>
  <rect x="676" y="130" width="224" height="232" rx="10" fill="#edf3fa" stroke="#4b74ab" stroke-width="1.6"/>
  <path d="M 686 130 H 890 Q 900 130 900 140 V 162 H 676 V 140 Q 676 130 686 130 Z" fill="#3b6296"/>
  <text x="788.0" y="151" text-anchor="middle" class="hdr">阶段 B · 线程运行与开发</text>
  <text x="788.0" y="194.5" text-anchor="middle" class="box-sub">• scripts（最多 50 条动作）</text>
  <text x="788.0" y="215.0" text-anchor="middle" class="box-sub">  详情栏 / 命令面板 / 快捷键运行</text>
  <text x="788.0" y="235.5" text-anchor="middle" class="box-sub">• previewUrl + autoOpenPreview</text>
  <text x="788.0" y="256.0" text-anchor="middle" class="box-sub">  拉起 Dev Server 自动开内嵌预览</text>
  <text x="788.0" y="276.5" text-anchor="middle" class="box-sub">• ignoreRepositories</text>
  <text x="788.0" y="297.0" text-anchor="middle" class="box-sub">  屏蔽 vendor 目录，不进 Diff</text>
  <text x="788.0" y="317.5" text-anchor="middle" class="box-sub">• iconPath（≤512 字符）</text>
  <text x="788.0" y="338.0" text-anchor="middle" class="box-sub">  优先于自动探测的项目图标</text>
  <rect x="928" y="130" width="216" height="232" rx="10" fill="#fdf5e4" stroke="#c28e34" stroke-width="1.6"/>
  <path d="M 938 130 H 1134 Q 1144 130 1144 140 V 162 H 928 V 140 Q 928 130 938 130 Z" fill="#a87624"/>
  <text x="1036.0" y="151" text-anchor="middle" class="hdr">阶段 C · 线程 Settle 结案</text>
  <text x="1036.0" y="194.5" text-anchor="middle" class="box-sub">1. stopOnSettle: true</text>
  <text x="1036.0" y="215.0" text-anchor="middle" class="box-sub">   自动停止该动作终端及子进程</text>
  <text x="1036.0" y="235.5" text-anchor="middle" class="box-sub">   （防止 Dev Server 僵尸驻留）</text>
  <text x="1036.0" y="256.0" text-anchor="middle" class="box-sub">2. runOnSettle: true</text>
  <text x="1036.0" y="276.5" text-anchor="middle" class="box-sub">   在 Worktree 跑清理如 cargo clean</text>
  <text x="1036.0" y="297.0" text-anchor="middle" class="box-sub">   成功自动关终端，失败保留现场</text>
  <text x="1036.0" y="317.5" text-anchor="middle" class="box-sub">   （主检出 local 线程自动跳过）</text>
  <text x="1036.0" y="338.0" text-anchor="middle" class="box-sub">3. worktreeLayout.remove</text>
  <line x1="648" y1="246" x2="676" y2="246" stroke="#0b6e67" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <line x1="900" y1="246" x2="928" y2="246" stroke="#3b6296" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <rect x="404" y="404" width="760" height="212" rx="12" fill="#fcefed" stroke="#c45b4d" stroke-width="1.6"/>
  <text x="424" y="430" class="box-title" style="fill:#63221a">安全边界：为什么打开陌生仓库的 t3.json 不会直接导致任意命令执行？</text>
  <rect x="424" y="446" width="230" height="152" rx="10" fill="#fcefed" stroke="#c45b4d" stroke-width="1.6"/>
  <path d="M 434 446 H 644 Q 654 446 654 456 V 478 H 424 V 456 Q 424 446 434 446 Z" fill="#a64538"/>
  <text x="539.0" y="467" text-anchor="middle" class="hdr">1. 命令哈希显式审批</text>
  <text x="539.0" y="502.5" text-anchor="middle" class="box-sub">LayoutCommandApprovals 对</text>
  <text x="539.0" y="522.5" text-anchor="middle" class="box-sub">create / remove 全文做哈希</text>
  <text x="539.0" y="542.5" text-anchor="middle" class="box-sub">仅 Web/Desktop 人工可批</text>
  <text x="539.0" y="562.5" text-anchor="middle" class="box-sub">仓库改动 1 个字符即自动失效</text>
  <text x="539.0" y="582.5" text-anchor="middle" class="box-sub">未批时阻塞手机/定时/Agent 建树</text>
  <rect x="672" y="446" width="230" height="152" rx="10" fill="#fdf5e4" stroke="#c28e34" stroke-width="1.6"/>
  <path d="M 682 446 H 892 Q 902 446 902 456 V 478 H 672 V 456 Q 672 446 682 446 Z" fill="#a87624"/>
  <text x="787.0" y="467" text-anchor="middle" class="hdr">2. Agent 权限硬门槛</text>
  <text x="787.0" y="502.5" text-anchor="middle" class="box-sub">Agent 永远无权审批布局命令</text>
  <text x="787.0" y="522.5" text-anchor="middle" class="box-sub">Agent 发起 Worktree 时，若权限</text>
  <text x="787.0" y="542.5" text-anchor="middle" class="box-sub">低于 Full access，自动跳过：</text>
  <text x="787.0" y="562.5" text-anchor="middle" class="box-sub">• runOnWorktreeCreate 脚本</text>
  <text x="787.0" y="582.5" text-anchor="middle" class="box-sub">• worktreeLayout 布局命令</text>
  <rect x="920" y="446" width="224" height="152" rx="10" fill="#eef3f5" stroke="#4b6d80" stroke-width="1.6"/>
  <path d="M 930 446 H 1134 Q 1144 446 1144 456 V 478 H 920 V 456 Q 920 446 930 446 Z" fill="#365668"/>
  <text x="1032.0" y="467" text-anchor="middle" class="hdr">3. 显式导入 + 组织策略</text>
  <text x="1032.0" y="502.5" text-anchor="middle" class="box-sub">scripts 需团队成员点击</text>
  <text x="1032.0" y="522.5" text-anchor="middle" class="box-sub">Import from t3.json 才激活</text>
  <text x="1032.0" y="542.5" text-anchor="middle" class="box-sub">管理员可通过 ManagedPolicy</text>
  <text x="1032.0" y="562.5" text-anchor="middle" class="box-sub">全局关停 worktreeLayoutCommands</text>
  <text x="1032.0" y="582.5" text-anchor="middle" class="box-sub">企业环境彻底杜绝不受控脚本</text>
</svg>