<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 810" width="1200" height="810" role="img" aria-label="T3 Code 多 Agent 编排机制与零轮询异步唤醒闭环">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif; }
      .title { font-size: 19px; font-weight: 700; fill: #172d32; }
      .subtitle { font-size: 13px; fill: #4f6668; }
      .hdr { font-size: 13.5px; font-weight: 700; fill: #ffffff; }
      .hdr-sub { font-size: 11.5px; fill: #e3f0f2; }
      .pill-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .box-title { font-size: 13.5px; font-weight: 700; fill: #172d32; }
      .box-sub { font-size: 12px; fill: #4f6668; }
      .label { font-size: 12.5px; font-weight: 700; fill: #172d32; }
      .small { font-size: 11.5px; fill: #4f6668; }
      .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #172d32; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#4c686b"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#0b6e67"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#a87624"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#a64538"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#3b6296"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.8 5 L 1 8.5 z" fill="#5d4b8c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="810" fill="#ffffff"/>

  <text x="36" y="40" class="title">T3 Code 多 Agent 委派闭环：权限天花板、Worktree 隔离与零轮询唤醒</text>
  <text x="36" y="62" class="subtitle">跨 Provider / 独立 Worktree / 跨机器任务通过 delegate_task 走应用托管子线程；完成后由服务端主动唤醒父线程</text>
  <rect x="36" y="84" width="266" height="54" rx="10" fill="#3b6296"/>
  <text x="169.0" y="106" text-anchor="middle" class="hdr">父线程 Agent</text>
  <text x="169.0" y="126" text-anchor="middle" class="hdr-sub">如 Claude / Antigravity / Codex</text>
  <line x1="169.0" y1="138" x2="169.0" y2="704" stroke="#c5d6d1" stroke-width="1.4" stroke-dasharray="5 5"/>
  <rect x="322" y="84" width="286" height="54" rx="10" fill="#365668"/>
  <text x="465.0" y="106" text-anchor="middle" class="hdr">T3 MCP &amp; Orchestrator V2</text>
  <text x="465.0" y="126" text-anchor="middle" class="hdr-sub">鉴权 · 幂等 · 策略裁决 · Outbox</text>
  <line x1="465.0" y1="138" x2="465.0" y2="704" stroke="#c5d6d1" stroke-width="1.4" stroke-dasharray="5 5"/>
  <rect x="628" y="84" width="262" height="54" rx="10" fill="#0b6e67"/>
  <text x="759.0" y="106" text-anchor="middle" class="hdr">本地托管子线程（Worktree）</text>
  <text x="759.0" y="126" text-anchor="middle" class="hdr-sub">独立 Thread + Composer + 任意模型</text>
  <line x1="759.0" y1="138" x2="759.0" y2="704" stroke="#c5d6d1" stroke-width="1.4" stroke-dasharray="5 5"/>
  <rect x="910" y="84" width="254" height="54" rx="10" fill="#5d4b8c"/>
  <text x="1037.0" y="106" text-anchor="middle" class="hdr">远端 Linked Environment</text>
  <text x="1037.0" y="126" text-anchor="middle" class="hdr-sub">另一台机器 / VPS（PeerForwarding）</text>
  <line x1="1037.0" y1="138" x2="1037.0" y2="704" stroke="#c5d6d1" stroke-width="1.4" stroke-dasharray="5 5"/>
  <rect x="46" y="154" width="246" height="56" rx="10" fill="#edf3fa" stroke="#4b74ab" stroke-width="1.6"/>
  <text x="169.0" y="177.0" text-anchor="middle" class="box-title" style="fill:#1c385c">① 首次探测能力（每线程一次）</text>
  <text x="169.0" y="196.5" text-anchor="middle" class="code">orchestrator_capabilities()</text>
  <rect x="338" y="154" width="254" height="56" rx="10" fill="#eef3f5" stroke="#4b6d80" stroke-width="1.6"/>
  <text x="465.0" y="177.0" text-anchor="middle" class="box-title" style="fill:#1b3340">返回在线 Provider 与模型目录</text>
  <text x="465.0" y="196.5" text-anchor="middle" class="box-sub">含 optionDescriptors 与 omittedModels</text>
  <line x1="292" y1="173" x2="338" y2="173" stroke="#3b6296" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="338" y1="192" x2="292" y2="192" stroke="#365668" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="46" y="228" width="246" height="72" rx="10" fill="#edf3fa" stroke="#4b74ab" stroke-width="1.6"/>
  <text x="169.0" y="249.2" text-anchor="middle" class="box-title" style="fill:#1c385c">② 发起委派（零父历史传递）</text>
  <text x="169.0" y="268.8" text-anchor="middle" class="code">delegate_task(task, target,</text>
  <text x="169.0" y="288.2" text-anchor="middle" class="code">isolation:'worktree', mode:'async')</text>
  <rect x="332" y="224" width="266" height="144" rx="10" fill="#eef3f5" stroke="#4b6d80" stroke-width="1.6"/>
  <path d="M 342 224 H 588 Q 598 224 598 234 V 256 H 332 V 234 Q 332 224 342 224 Z" fill="#365668"/>
  <text x="465.0" y="245" text-anchor="middle" class="hdr">③ 服务端安全与幂等裁决</text>
  <text x="465.0" y="277.8" text-anchor="middle" class="box-sub">• clientRequestId → 稳定 Receipt 防重放</text>
  <text x="465.0" y="297.2" text-anchor="middle" class="box-sub">• 权限天花板：子模式 ≤ 父 runtimeMode</text>
  <text x="465.0" y="316.8" text-anchor="middle" class="box-sub">• 校验 ManagedPolicy 与实例启用状态</text>
  <text x="465.0" y="336.2" text-anchor="middle" class="box-sub">• completionWake: 'always'（异步唤醒）</text>
  <text x="465.0" y="355.8" text-anchor="middle" class="box-sub">• 写入 delegated_task.request 领域事件</text>
  <line x1="292" y1="264" x2="332" y2="264" stroke="#3b6296" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <rect x="638" y="232" width="242" height="124" rx="10" fill="#e9f5f2" stroke="#168077" stroke-width="1.6"/>
  <path d="M 648 232 H 870 Q 880 232 880 242 V 264 H 638 V 242 Q 638 232 648 232 Z" fill="#0b6e67"/>
  <text x="759.0" y="253" text-anchor="middle" class="hdr">④A 本地隔离执行</text>
  <text x="759.0" y="285.5" text-anchor="middle" class="box-sub">基于父精确 HEAD 创建 Worktree</text>
  <text x="759.0" y="305.0" text-anchor="middle" class="box-sub">（未提交改动不带入，防冲突）</text>
  <text x="759.0" y="324.5" text-anchor="middle" class="box-sub">可选任意 Provider / 模型 / 思考档位</text>
  <text x="759.0" y="344.0" text-anchor="middle" class="box-sub">独立 Composer，用户可随时介入</text>
  <line x1="598" y1="286" x2="638" y2="286" stroke="#0b6e67" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <rect x="598.8" y="261.5" width="38.4" height="17" rx="4" fill="#ffffff" opacity="0.94"/>
  <text x="618.0" y="274.0" text-anchor="middle" class="small" style="fill:#0b6e67;font-weight:600">本地</text>
  <rect x="920" y="232" width="234" height="124" rx="10" fill="#f2effa" stroke="#7763ad" stroke-width="1.6"/>
  <path d="M 930 232 H 1144 Q 1154 232 1154 242 V 264 H 920 V 242 Q 920 232 930 232 Z" fill="#5d4b8c"/>
  <text x="1037.0" y="253" text-anchor="middle" class="hdr">④B 跨机器委派</text>
  <text x="1037.0" y="285.5" text-anchor="middle" class="box-sub">按仓库 canonicalKey 匹配项目</text>
  <text x="1037.0" y="305.0" text-anchor="middle" class="box-sub">远端启动普通 Thread 执行</text>
  <text x="1037.0" y="324.5" text-anchor="middle" class="box-sub">受链接配对权限 + 父模式双重约束</text>
  <text x="1037.0" y="344.0" text-anchor="middle" class="box-sub">本地挂轻量 Follower 跟踪终态</text>
  <path d="M 598 334 H 614 V 382 H 896 V 294 H 920" fill="none" stroke="#5d4b8c" stroke-width="1.8" marker-end="url(#arr-violet)"/>
  <rect x="753.0" y="361.5" width="154.0" height="17" rx="4" fill="#ffffff" opacity="0.95"/>
  <text x="830.0" y="374.0" text-anchor="middle" class="small" style="fill:#5d4b8c;font-weight:600">target.environmentId</text>
  <rect x="46" y="404" width="246" height="98" rx="10" fill="#fdf5e4" stroke="#c28e34" stroke-width="1.6"/>
  <path d="M 56 404 H 282 Q 292 404 292 414 V 436 H 46 V 414 Q 46 404 56 404 Z" fill="#a87624"/>
  <text x="169.0" y="425" text-anchor="middle" class="hdr">⑤ 立即返回 &amp; 结束本轮 Turn</text>
  <text x="169.0" y="456.0" text-anchor="middle" class="box-sub">收到 taskId + next 契约指令：</text>
  <text x="169.0" y="475.5" text-anchor="middle" class="box-sub">严禁轮询 task_status 或 sleep</text>
  <text x="169.0" y="495.0" text-anchor="middle" class="box-sub">处理完其余工作即结束 Turn，零空耗</text>
  <path d="M 465 368 V 452 H 292" fill="none" stroke="#a87624" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-amber)"/>
  <rect x="329.6" y="429.5" width="104.8" height="17" rx="4" fill="#ffffff" opacity="0.95"/>
  <text x="382.0" y="442.0" text-anchor="middle" class="small" style="fill:#a87624;font-weight:600">async 立即回执</text>
  <rect x="638" y="424" width="242" height="78" rx="10" fill="#e9f5f2" stroke="#168077" stroke-width="1.6"/>
  <text x="759.0" y="448.2" text-anchor="middle" class="box-title" style="fill:#0c4742">⑥A 子任务独立推进至终态</text>
  <text x="759.0" y="467.8" text-anchor="middle" class="box-sub">完成 / 失败 / 取消</text>
  <text x="759.0" y="487.2" text-anchor="middle" class="box-sub">若遇提问或审批：上报父线程感知</text>
  <rect x="920" y="424" width="234" height="78" rx="10" fill="#f2effa" stroke="#7763ad" stroke-width="1.6"/>
  <text x="1037.0" y="448.2" text-anchor="middle" class="box-title" style="fill:#352859">⑥B 远端完成 &amp; Follower 回收</text>
  <text x="1037.0" y="467.8" text-anchor="middle" class="box-sub">10 分钟切片等待 + 指数退避重连</text>
  <text x="1037.0" y="487.2" text-anchor="middle" class="box-sub">重启自动恢复跟踪，不丢结果</text>
  <line x1="759" y1="356" x2="759" y2="424" stroke="#0b6e67" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <line x1="1037" y1="356" x2="1037" y2="424" stroke="#5d4b8c" stroke-width="1.8" marker-end="url(#arr-violet)"/>
  <rect x="332" y="540" width="266" height="110" rx="10" fill="#e9f5f2" stroke="#168077" stroke-width="1.6"/>
  <path d="M 342 540 H 588 Q 598 540 598 550 V 572 H 332 V 550 Q 332 540 342 540 Z" fill="#0b6e67"/>
  <text x="465.0" y="561" text-anchor="middle" class="hdr">⑦ DelegatedCompletion 唤醒</text>
  <text x="465.0" y="596.2" text-anchor="middle" class="box-sub">收集终态子任务批次（Cohort）</text>
  <text x="465.0" y="615.8" text-anchor="middle" class="box-sub">ProviderContinuationService 拼摘要</text>
  <text x="465.0" y="635.2" text-anchor="middle" class="box-sub">生成自动续跑请求，唤醒休眠父线程</text>
  <path d="M 759 502 V 578 H 598" fill="none" stroke="#0b6e67" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <rect x="638.4" y="555.5" width="87.2" height="17" rx="4" fill="#ffffff" opacity="0.95"/>
  <text x="682.0" y="568.0" text-anchor="middle" class="small" style="fill:#0b6e67;font-weight:600">本地终态事件</text>
  <path d="M 1037 502 V 614 H 598" fill="none" stroke="#5d4b8c" stroke-width="1.8" marker-end="url(#arr-violet)"/>
  <rect x="763.1" y="591.5" width="125.8" height="17" rx="4" fill="#ffffff" opacity="0.95"/>
  <text x="826.0" y="604.0" text-anchor="middle" class="small" style="fill:#5d4b8c;font-weight:600">Follower 回写终态</text>
  <rect x="46" y="540" width="246" height="110" rx="10" fill="#edf3fa" stroke="#4b74ab" stroke-width="1.6"/>
  <path d="M 56 540 H 282 Q 292 540 292 550 V 572 H 46 V 550 Q 46 540 56 540 Z" fill="#3b6296"/>
  <text x="169.0" y="561" text-anchor="middle" class="hdr">⑧ 父线程被唤醒并综合交付</text>
  <text x="169.0" y="596.2" text-anchor="middle" class="box-sub">读取各子任务 summary 与产物路径</text>
  <text x="169.0" y="615.8" text-anchor="middle" class="box-sub">小修自改 / 大修发新 delegate_task</text>
  <text x="169.0" y="635.2" text-anchor="middle" class="box-sub">（绝不对旧子线程重复发审查）</text>
  <line x1="332" y1="595" x2="292" y2="595" stroke="#0b6e67" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <rect x="292.8" y="570.5" width="38.4" height="17" rx="4" fill="#ffffff" opacity="0.94"/>
  <text x="312.0" y="583.0" text-anchor="middle" class="small" style="fill:#0b6e67;font-weight:600">唤醒</text>
  <rect x="36" y="684" width="562" height="92" rx="10" fill="#fcefed" stroke="#c45b4d" stroke-width="1.6"/>
  <text x="317.0" y="707.5" text-anchor="middle" class="box-title" style="fill:#63221a">级联取消与安全红线</text>
  <text x="317.0" y="726.0" text-anchor="middle" class="box-sub">父线程 Stop / task_cancel → Outbox delegated-tasks.stop 递归停子孙（先校验未提权）</text>
  <text x="317.0" y="744.5" text-anchor="middle" class="box-sub">原生子 Agent（同 Provider 内 Agent/spawn_agent）仅只读投影，审批冒泡回父线程</text>
  <text x="317.0" y="763.0" text-anchor="middle" class="box-sub">子任务禁止自行 watch_pull_request，PR 守望权统一归父线程管理</text>
  <rect x="618" y="684" width="546" height="92" rx="10" fill="#fdf5e4" stroke="#c28e34" stroke-width="1.6"/>
  <text x="891.0" y="707.5" text-anchor="middle" class="box-title" style="fill:#5e410d">mode: 'wait' 同步降级机制</text>
  <text x="891.0" y="726.0" text-anchor="middle" class="box-sub">仅本轮立刻需要结果时使用，单次阻塞等待上限 45s</text>
  <text x="891.0" y="744.5" text-anchor="middle" class="box-sub">遇子任务待审批（pendingApproval）、待提问或超时即刻返回不死等</text>
  <text x="891.0" y="763.0" text-anchor="middle" class="box-sub">超时绝不取消子任务，自动将唤醒策略从 settled_only 升级为 always 异步唤醒</text>
</svg>